name: Build macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release tujuan (mis. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build DMG (arm64 + x64)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Upload ke release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" app/dist/*.dmg --clobber --repo "${{ github.repository }}"
